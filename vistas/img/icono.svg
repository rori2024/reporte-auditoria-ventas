<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icono de Auditoría de Formas de Pago.

  Una balanza en equilibrio: es lo que hace la aplicación, contrastar el
  encabezado, el detalle y los pagos de una misma factura para dictar si
  cuadra o no cuadra. Es el mismo símbolo que ya identifica al sistema en
  el botón «Auditar» y en el panel «El veredicto» (`vistas/iconos.php`,
  clave `balanza`), para que sea el mismo dibujo en todos los sitios.

  Respecto al trazado de la interfaz, aquí los platillos van macizos y el
  balancín algo más grueso: a 16 px, que es el tamaño de la pestaña, el
  contorno fino de los platillos cae por debajo del píxel y la balanza se
  convierte en una mancha. Macizos, la silueta aguanta.

  Colores: el degradado de marca del sistema de diseño, del token
  `primary` (#0369a1) al `navy` (#0f172a), tal y como están en
  `vistas/css/tokens.css`. Nada de valores sueltos.

  Es la pieza maestra: de aquí salen los PNG de `icono-*.png` con
  `herramientas/generate_icon.py rasterizar`. Si hay que cambiar algo, se
  cambia aquí y se vuelven a generar. Un PNG no se retoca a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Auditoría de Formas de Pago">

    <defs>
        <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0369a1"/>
            <stop offset="1" stop-color="#0f172a"/>
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#marca)"/>

    <g id="simbolo" transform="translate(14 12.5) scale(1.5)" fill="none"
       stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

        <!-- El mástil, el pie y el balancín -->
        <path d="M12 5.4v15.2M7.6 20.6h8.8M4 7h16"/>

        <!-- Los tirantes: detalle que luce en grande y desaparece solo en pequeño -->
        <path d="M4 7v3.3M20 7v3.3" stroke-width="1.3"/>

        <!-- Los dos platillos, macizos para que sobrevivan a 16 px -->
        <path d="M0 10.5h8a4 4 0 0 1-8 0Z" fill="#ffffff" stroke="none"/>
        <path d="M16 10.5h8a4 4 0 0 1-8 0Z" fill="#ffffff" stroke="none"/>
    </g>
</svg>
